## Start the AirPods Pro on A2DP playback. After resume they could come up
## with the card profile "off", which exposes no audio sink.

monitor.bluez.rules = [
  {
    matches = [
      {
        device.name = "bluez_card.70_8C_F2_8E_06_0F"
      }
    ]
    actions = {
      update-props = {
        device.profile = "a2dp-sink"
      }
    }
  }
]
